<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>熟語花火</title>
    <meta name="description" content="熟語を作ってドカンと爆発！新感覚の漢字パズルゲーム">
    <meta property="og:title" content="熟語花火">
    <meta property="og:description" content="熟語を作ってドカンと爆発！新感覚の漢字パズルゲーム">
    <meta property="og:url" content="https://nonaka-a.github.io/jukugo/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://nonaka-a.github.io/jukugo/assets/images/ogp-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="熟語花火">
    <meta name="twitter:description" content="熟語を作ってドカンと爆発！新感覚の漢字パズルゲーム">
    <meta name="twitter:image" content="https://nonaka-a.github.io/jukugo/assets/images/ogp-image.png">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="js/dictionary.js"></script>
    <script src="js/config.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XE2BKG5S67"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-XE2BKG5S67');
</script>
</head>
<body>
    <div id="app-container">
    
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-spinner"></div>
        <div class="loading-text">読み込み中…</div>
    </div>
    
    <!-- Title Screen -->
    <div id="title-screen">
        <img src="assets/images/logo.png" class="title-logo" alt="熟語花火">
        <div class="difficulty-selection">
            <button class="diff-btn tutorial" onclick="openTutorial()">あそびかた</button>
            <button class="diff-btn easy" onclick="startGame('easy')">かんたん</button>
            <button class="diff-btn normal" onclick="startGame('normal')">むずかしい</button>
            <button class="menu-btn" style="margin-top:20px; background-color: #8ab04c; border-top-color: #a3cc5a; border-left-color: #8ab04c; border-right-color: #6d8c3b; border-bottom-color: #6d8c3b;" onclick="toggleCollection()">これくしょん</button>
            <button class="menu-btn" style="background-color: #0984e3; border-top-color: #74b9ff; border-left-color: #0984e3; border-right-color: #0652dd; border-bottom-color: #0652dd;" onclick="window.open('https://nonaka-a.github.io/NOA_Games/', '_blank')">NOA Games</button>
        </div>
        <button class="title-settings-btn" onclick="toggleSettings()"><img src="assets/images/haguruma.png" alt="settings"></button>
    </div>

    <div id="tutorial-screen" style="display:none;">
        <div id="tutorial-stats-container">
            <div class="stats-row">
                <div>すてーじ: <span id="tutorial-stage-val">1</span></div>
                <div>せつめい: <span id="tutorial-step-val">1/5</span></div>
                <div>のこり敵: <span id="tutorial-enemy-val">1</span></div>
            </div>
        </div>

        <div id="tutorial-main-area">
            <div class="tutorial-stage-shell">
                <div class="tutorial-stage-scale">
                    <div class="tutorial-game-window">
                        <div id="tutorial-grid-container"></div>
                        <div id="tutorial-launcher" style="display:none;"></div>
                        <div id="tutorial-guide-line" style="display:none;"></div>
                        <div id="tutorial-shot-tile" style="display:none;"></div>
                    </div>

                    <div id="tutorial-solo-hand-area">
                        <div id="tutorial-hand-container" class="hand-container"></div>
                    </div>
                </div>
            </div>

            <div id="tutorial-text-panel">
                <div id="tutorial-step-title">あそびかた 1</div>
                <div id="tutorial-step-text"></div>
            </div>

            <div id="tutorial-controls">
                <button id="tutorial-prev-btn" class="menu-btn" onclick="prevTutorialStep()">もどる</button>
                <button id="tutorial-close-btn" class="menu-btn" onclick="closeTutorial()">とじる</button>
                <button id="tutorial-next-btn" class="menu-btn" onclick="nextTutorialStep()">次へ</button>
            </div>
        </div>
    </div>

    <div id="stats-container" style="display:none;">
        <div class="stats-row">
            <div>すてーじ: <span id="stage-val">1</span></div>
            <div id="time-container" style="position: relative;">制限時間: <span id="time-val">200</span></div>
            <div>のこり敵: <span id="enemy-val">0</span></div>
        </div>
        <div class="stats-row" style="gap: 10px;">
            <div id="lamp-container" class="lamp-container"></div>
            <div id="powerup-label" style="color: #d63031; font-weight: 900; font-size: 1.2em;"></div>
        </div>
    </div>
    
    <div id="game-layout">
    <div id="main-area-container">
        <div id="main-area">
            <div id="game-window">
                <div id="grid-container"></div>
                <div id="launcher" style="display:none;"></div>
                <div id="guide-line" style="display:none;"></div>
                <button id="settings-btn" onclick="toggleSettings()"><img src="assets/images/haguruma.png" alt="settings"></button>
                <button id="history-btn" onclick="toggleHistory()">熟</button>
            </div>

            <div id="solo-hand-area">
                <div id="player-hand-container" class="hand-container"></div>
                <button class="shuffle-btn" onclick="shuffleHand()">しゃっふる</button>
            </div>
        </div>
    </div>
    </div>

        <!-- Settings Modal -->
        <div id="settings-overlay" onclick="if(event.target === this) toggleSettings()">
            <div id="settings-modal">
                <h2>せってい</h2>
                <div class="setting-item">
                    <span>ブロック追加</span>
                    <select id="speed-select" onchange="updateDifficulty()">
                        <option value="10000">10秒（はやい）</option>
                        <option value="20000" selected>20秒（ゆっくり）</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span>サウンド</span>
                    <button id="sound-toggle-btn" onclick="toggleSound()">ON</button>
                </div>
                <div class="setting-item">
                    <span>フルスクリーン</span>
                    <button onclick="toggleFullscreen()">切替</button>
                </div>
                <hr>
                <button class="menu-btn" onclick="backToTitle()">たいとるに戻る</button>
                <button id="close-settings-btn" onclick="toggleSettings()">とじる</button>
            </div>
        </div>

        <!-- History Modal -->
        <div id="history-overlay" onclick="if(event.target === this) toggleHistory()">
            <div id="history-modal">
                <h2>作った熟語</h2>
                <div id="history-list"></div>
                <button class="menu-btn" style="background-color: #8ab04c; border-top-color: #a3cc5a; border-left-color: #8ab04c; border-right-color: #6d8c3b; border-bottom-color: #6d8c3b; margin-bottom: 10px;" onclick="toggleCollection()">これくしょんを見る</button>
                <button class="menu-btn" onclick="toggleHistory()">とじる</button>
            </div>
        </div>

        <!-- Collection Modal -->
        <div id="collection-overlay" onclick="if(event.target === this) toggleCollection()">
            <div id="history-modal">
                <h2>仲間図鑑これくしょん</h2>
                <div class="collection-description">関連する熟語を集めて[ぐるーぷ]を完成させよう。<br>完全制覇を目指せ！</div>
                
                <div id="collection-rank-container">
                    <div class="rank-title-row">
                        <span class="rank-label">称号：</span>
                        <span id="rank-name">熟語見習い</span>
                        <span id="rank-progress">（達成数: 0/9）</span>
                    </div>
                    <div id="rank-desc">さあ熟語収集をスタートさせよう！</div>
                </div>

                <div id="collection-list"></div>
                <div id="collection-detail"></div>
                <button class="menu-btn" style="background-color: #8ab04c; border-top-color: #a3cc5a; border-left-color: #8ab04c; border-right-color: #6d8c3b; border-bottom-color: #6d8c3b;" onclick="toggleCollection()">とじる</button>
            </div>
        </div>

        <!-- Roulette Overlay -->
        <div id="roulette-overlay" style="display:none;">
            <div id="roulette-container">
                <h2>ぱわーあっぷるーれっと！</h2>
                <div class="roulette-description">ルーレットを止めて「花火」「十字」「対角」「爆発」の熟語を作ろう！</div>
                <div class="slots">
                    <div id="slot-upper" class="slot">
                        <div class="slot-strip" id="strip-upper"></div>
                    </div>
                    <div id="slot-lower" class="slot">
                        <div class="slot-strip" id="strip-lower"></div>
                    </div>
                </div>
                <div class="roulette-guide">画面をクリックして止めて！</div>
            </div>
        </div>

        <!-- Stage Clear Modal -->
        <div id="stage-clear-overlay" style="display:none;">
            <div id="stage-clear-modal">
                <h2 id="clear-title">すてーじ<br>くりあ！</h2>
                <div class="modal-buttons">
                    <button class="clear-btn next" onclick="nextStage()">つぎへ</button>
                    <button class="clear-btn title" onclick="backToTitleFromClear()">たいとるへ</button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-overlay" style="display:none;">
            <div id="stage-clear-modal">
                <h2 id="clear-title"><img src="assets/images/game_over.png" alt="げーむおーばー！" style="width: 100%; max-width: 320px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));"></h2>
                <div class="modal-buttons">
                    <button class="clear-btn title" onclick="backToTitleFromGameOver()">たいとるへ</button>
                </div>
            </div>
        </div>
        
        <!-- Debug Button (一時的に非表示) -->
        <button id="debug-skip-btn" onclick="loadStage(4)" style="display:none;">Skip to S5</button>
        <button id="debug-explode-btn" onclick="explodeAllEnemies()" style="display:none;">Explode All</button>
    </div>
    
</body>
</html>
